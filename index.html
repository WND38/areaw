<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AREAW</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/webp" href="omegaw.jpg">
</head>
<body>
    <div id="content" class="blurred">
        <h1>welcome!</h1>
        <div>
            <a href="#" class="typewrite" data-period="2200" data-type='[
                "simple and stylish ;)",
                "clan of toju. ",
                "work in progress! :)",
                "relax",
                "4 fun only",
                "since zer0six",
                "tomorrows wind",
                "custom themes in the future.", 
                "*insert edgy text here*",
                "its a nice day outside",
                "touch grass everyday!",
                ":D",
                "Thank you for spending your time here!"
            ]'>
                <span class="wrap"></span>
            </a>
        </div>
        <div id="audio-controls">
            <span id="audio-label">
            play & pause 
            </span>
            <input type="range" id="play-pause-slider" min="0" max="1" step="1" value="0">
        </div>
        <div id="ascii-container">
            <pre id="ascii-art"></pre>
        </div>
    </div>
    <button id="start-button">Press Here to Start</button>
    <audio id="audio" loop>
        <source src="https://github.com/WND38/areaw/raw/refs/heads/main/audio/song2.m4a" type="audio/mp4">
        Your browser does not support the audio element.
    </audio>
    <script src="script.js"></script>

</html>
